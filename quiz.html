<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic quizzes — CIS*3150 Midterm 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2333363B'/%3E%3Ctext x='16' y='21' font-size='14' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-head"></header>
<main class="wrap">
  <section id="setup" class="setup">
    <h1 style="font-size:clamp(32px,4.6vw,48px)">Topic quizzes</h1>
    <p class="lede" style="margin-bottom:30px">Untimed practice. You see whether you were right, and why, after every question.</p>
    <div class="row">
      <span class="lbl">Topics</span>
      <div class="chips" id="topic-chips" role="group" aria-label="Topics"></div>
    </div>
    <div class="row">
      <span class="lbl">Length</span>
      <div class="seg" id="len" role="group" aria-label="Number of questions">
        <button type="button" data-n="10" aria-pressed="true">10</button>
        <button type="button" data-n="20" aria-pressed="false">20</button>
        <button type="button" data-n="0" aria-pressed="false">All</button>
      </div>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="prof-only"> Only questions in the practice-test style (5 choices, shared setups) <span class="muted small" id="prof-count"></span></label><br>
      <label class="toggle" style="margin-top:8px"><input type="checkbox" id="lecture-only"> Only questions from the lecture slides</label><br>
      <label class="toggle" style="margin-top:8px"><input type="checkbox" id="missed-only"> Only questions I’ve missed before <span class="muted small" id="missed-count"></span></label>
    </div>
    <div class="btn-row">
      <button class="btn" id="start" type="button">Start quiz</button>
      <span class="muted small" id="pool-count"></span>
    </div>
  </section>

  <section id="run" hidden>
    <div class="quiz-top">
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <span class="small muted" id="counter"></span>
      <button class="btn secondary small" id="quit" type="button">End quiz</button>
    </div>
    <div class="quiz-area" id="qarea"></div>
    <div class="btn-row" style="margin-top:18px;max-width:820px;justify-content:flex-end">
      <span class="small muted">Answer with <kbd>A</kbd>–<kbd>E</kbd>, continue with <kbd>Enter</kbd></span>
      <button class="btn" id="next" type="button" disabled>Next question</button>
    </div>
  </section>

  <section id="done" hidden class="quiz-area"></section>
</main>
<footer id="site-foot"></footer>
<script src="assets/questions.js"></script>
<script src="assets/questions-prof.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var t0 = parseInt(params.get('topic'), 10);
  var selected = { 1: true, 2: true, 3: true, 4: true };
  if (t0 >= 1 && t0 <= 4) { selected = { 1: false, 2: false, 3: false, 4: false }; selected[t0] = true; }
  var length = 10;
  var missed = App.store.get('missed', {}); // id -> true

  var chips = document.getElementById('topic-chips');
  [1, 2, 3, 4].forEach(function (t) {
    var n = QB.filter(function (q) { return q.t === t; }).length;
    var b = App.el('button', { class: 'chip', type: 'button', 'aria-pressed': selected[t] ? 'true' : 'false' },
      '<span class="bubble" aria-hidden="true">' + t + '</span>' + TOPICS[t].name + ' <span class="count">' + n + '</span>');
    b.addEventListener('click', function () {
      selected[t] = !selected[t];
      if (![1, 2, 3, 4].some(function (k) { return selected[k]; })) selected[t] = true;
      b.setAttribute('aria-pressed', selected[t] ? 'true' : 'false');
      updatePool();
    });
    chips.appendChild(b);
  });
  document.querySelectorAll('#len button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#len button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true'); length = parseInt(b.dataset.n, 10); updatePool();
    });
  });
  var lectureOnly = document.getElementById('lecture-only'), missedOnly = document.getElementById('missed-only'), profOnly = document.getElementById('prof-only');
  if (params.get('style') === 'prof') profOnly.checked = true;
  lectureOnly.addEventListener('change', updatePool); missedOnly.addEventListener('change', updatePool); profOnly.addEventListener('change', updatePool);

  function pool() {
    return QB.filter(function (q) {
      return selected[q.t] && (!lectureOnly.checked || q.src === 'lecture') && (!missedOnly.checked || missed[q.id]) && (!profOnly.checked || q.fmt === 'prof');
    });
  }
  function updatePool() {
    var p = pool(), n = length && length < p.length ? length : p.length;
    var mc = Object.keys(missed).length;
    document.getElementById('missed-count').textContent = mc ? '(' + mc + ')' : '(none yet)';
    document.getElementById('prof-count').textContent = '(' + QB.filter(function (q) { return selected[q.t] && q.fmt === 'prof'; }).length + ')';
    document.getElementById('pool-count').textContent = p.length ? n + ' of ' + p.length + ' matching questions' : 'No questions match. Turn a filter off.';
    document.getElementById('start').disabled = !p.length;
  }
  updatePool();

  var items = [], idx = 0, answers = [];
  function start(list) {
    var p = list || pool();
    p = App.shuffle(p);
    if (!list && length) p = p.slice(0, length);
    p = App.arrange(p);
    items = p.map(App.instance); answers = items.map(function () { return null; }); idx = 0;
    document.getElementById('setup').hidden = true; document.getElementById('done').hidden = true; document.getElementById('run').hidden = false;
    render(); window.scrollTo(0, 0);
  }
  document.getElementById('start').addEventListener('click', function () { start(); });

  function render() {
    var area = document.getElementById('qarea'); area.innerHTML = '';
    var answered = answers[idx] != null;
    var g = App.byId(items[idx].id).g, prevG = idx > 0 ? App.byId(items[idx - 1].id).g : null;
    area.appendChild(App.renderQuestion({ inst: items[idx], number: idx + 1, total: items.length, selected: answers[idx], reveal: answered, onSelect: choose,
      groupLabel: g && g === prevG ? 'Same setup as the previous question' : 'Setup for this question' }));
    document.getElementById('bar').style.width = ((idx + (answered ? 1 : 0)) / items.length * 100) + '%';
    document.getElementById('counter').textContent = score() + ' correct so far';
    var nx = document.getElementById('next');
    nx.disabled = !answered;
    nx.textContent = idx === items.length - 1 ? 'See results' : 'Next question';
    if (answered) nx.focus();
  }
  function score() { return answers.reduce(function (s, a, i) { return s + (App.isCorrect(items[i], a) ? 1 : 0); }, 0); }
  function choose(di) {
    if (answers[idx] != null) return;
    answers[idx] = di;
    var id = items[idx].id;
    if (App.isCorrect(items[idx], di)) delete missed[id]; else missed[id] = true;
    App.store.set('missed', missed);
    render();
  }
  function next() {
    if (answers[idx] == null) return;
    if (idx < items.length - 1) { idx++; render(); window.scrollTo({ top: 0 }); } else finish();
  }
  document.getElementById('next').addEventListener('click', next);
  document.getElementById('quit').addEventListener('click', finish);
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('run').hidden) return;
    var k = App.choiceKey(e);
    if (k >= 0 && answers[idx] == null && k < items[idx].order.length) { e.preventDefault(); choose(k); }
    else if (e.key === 'Enter' && answers[idx] != null && document.activeElement && document.activeElement.id !== 'quit') { e.preventDefault(); next(); }
  });

  function finish() {
    var done = document.getElementById('done');
    var attempted = answers.filter(function (a) { return a != null; }).length;
    var s = score();
    document.getElementById('run').hidden = true; done.hidden = false;
    var wrongItems = items.filter(function (it, i) { return answers[i] != null && !App.isCorrect(it, answers[i]); });
    var html = '<h1 style="font-size:clamp(30px,4vw,44px)">Quiz results</h1>' +
      '<div class="result-score">' + s + '/' + attempted + '</div>' +
      '<p class="muted">' + (attempted ? Math.round(s / attempted * 100) + '% correct' : 'No questions answered') + (attempted < items.length ? ', ' + (items.length - attempted) + ' skipped' : '') + '.</p>' +
      '<div class="btn-row" style="margin:20px 0 34px">' +
      (wrongItems.length ? '<button class="btn" id="retry" type="button">Retry the ' + wrongItems.length + ' I missed</button>' : '') +
      '<button class="btn secondary" id="again" type="button">New quiz</button><a class="btn secondary" href="exam.html">Practice exam</a></div>' +
      '<ul class="review-list" id="review"></ul>';
    done.innerHTML = html;
    var ul = document.getElementById('review');
    items.forEach(function (it, i) {
      if (answers[i] == null) return;
      var q = App.byId(it.id), ok = App.isCorrect(it, answers[i]);
      var li = App.el('li', { class: 'review-item ' + (ok ? 'right' : 'wrong') });
      li.innerHTML = (q.g && window.GROUPS ? '<details class="small"><summary>Show the shared setup</summary><div class="stem" style="margin-top:8px">' + GROUPS[q.g] + '</div></details>' : '') + '<div class="q">' + q.q + '</div><div class="ans">' + (ok ? '<b class="r">Correct:</b> ' + q.c[q.a] :
        '<b class="w">You chose:</b> ' + q.c[it.order[answers[i]]] + '<br><b class="r">Answer:</b> ' + q.c[q.a]) + '</div>' +
        '<details><summary>Why</summary><p>' + q.x + '</p></details>';
      ul.appendChild(li);
    });
    var r = document.getElementById('retry');
    if (r) r.addEventListener('click', function () { start(wrongItems.map(function (it) { return App.byId(it.id); })); });
    document.getElementById('again').addEventListener('click', function () { done.hidden = true; document.getElementById('setup').hidden = false; updatePool(); window.scrollTo(0, 0); });
    window.scrollTo(0, 0);
  }
})();
</script>
</body>
</html>
